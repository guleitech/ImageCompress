# ============================================
# Cloudflare Workers 配置文件
# ============================================
name = "imagecompress-api"
main = "workers/index.js"
compatibility_date = "2024-01-01"

# ============================================
# D1 数据库绑定
# ============================================
[[d1_databases]]
binding = "DB"
database_name = "imagecompress-db"
database_id = "" # 部署后替换为实际数据库 ID

# ============================================
# 环境变量（敏感信息）
# ============================================
# 这些变量需要在 Cloudflare Dashboard 中设置
# 或通过 wrangler secret put 命令添加

# [vars]
# 不在此文件中暴露敏感信息，使用 Secrets 管理

# ============================================
# Secrets 列表（需要手动配置）
# ============================================
# wrangler secret put GOOGLE_CLIENT_ID
# wrangler secret put STRIPE_SECRET_KEY
# wrangler secret put STRIPE_WEBHOOK_SECRET
# wrangler secret put APP_URL

# ============================================
# 开发环境配置
# ============================================
# 本地开发使用 wrangler dev --local

# ============================================
# 生产环境路由
# ============================================
# Workers 将与 Pages 绑定，通过以下路由访问:
# /api/* -> Workers API
# 其他路径 -> Pages 静态文件